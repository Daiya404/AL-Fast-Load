name: Bug report
description: Report a problem, broken page, or performance regression in AniList Fast Load.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem! Please search existing issues first.
        **Never include cookies, authorization headers, login tokens, or other private account information.**
  - type: input
    id: version
    attributes:
      label: Fast Load version
      description: The version shown in your userscript manager.
      placeholder: "0.2.5"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Firefox 143 / Chrome 140"
    validations:
      required: true
  - type: input
    id: manager
    attributes:
      label: Userscript manager and version
      placeholder: "Violentmonkey / Tampermonkey"
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: AniList page or route
      placeholder: "e.g. anime list, activity feed, user profile"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the problem
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Scroll to ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: other-scripts
    attributes:
      label: Other userscripts and extensions
      description: Mention anything that may affect AniList or its page content.
      placeholder: "AL Additions, AniList Tier Labels, ad blockers, etc."
    validations:
      required: false
  - type: textarea
    id: console
    attributes:
      label: Console errors or diagnostics
      description: Paste relevant errors with private information removed. You can inspect window.__ALFL_STATS__ in the browser console.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked whether the issue already exists.
          required: true
        - label: I tested whether disabling Fast Load changes the behavior.
          required: false
        - label: I removed private information from logs and screenshots.
          required: true
