name: Bug report
description: Report a bug, broken page, or performance regression.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Search existing issues first.
        Never include cookies, authorization headers, login tokens, or private account data.
  - type: input
    id: version
    attributes:
      label: Fast Load version
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: "Firefox / Chrome and version"
    validations:
      required: true
  - type: input
    id: manager
    attributes:
      label: Userscript manager and version
      placeholder: "Violentmonkey / Tampermonkey"
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Affected AniList page
      placeholder: "e.g. anime list, manga list, activity feed, user profile"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected and actual behaviour.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Do ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: scripts
    attributes:
      label: Other userscripts or extensions
      description: Mention other tools that may affect AniList.
    validations:
      required: false
  - type: textarea
    id: diagnostics
    attributes:
      label: Console errors or diagnostics
      description: Relevant console errors or window.__ALFL_STATS__ output. Remove all private data.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched for an existing report.
          required: true
        - label: I removed credentials and private account data.
          required: true
        - label: I tested with Fast Load disabled, if practical.
          required: false
